<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — {{ business_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="logo" style="justify-content:center;margin-bottom:1.5rem">
      <span class="gecko">🦎</span>
      <span class="biz-name">{{ business_name }}</span>
    </div>
    <h2 style="text-align:center;margin-bottom:1.5rem;color:var(--muted);font-size:1rem;font-weight:400">
      Social Post Manager
    </h2>

    {% if error %}
    <p class="alert alert-error">{{ error }}</p>
    {% endif %}

    <form method="post">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button class="btn btn-approve" type="submit" style="width:100%;margin-top:1rem;padding:.7rem">
        Sign In
      </button>
    </form>
  </div>
</body>
</html>
