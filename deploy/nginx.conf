# Add this server block to your nginx config, or include it from /etc/nginx/sites-enabled/
# Assumes the Flask app runs on localhost:5000

server {
    listen 80;
    server_name social.webgecko.com.au;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name social.webgecko.com.au;

    # SSL — use certbot to generate:  certbot --nginx -d social.webgecko.com.au
    ssl_certificate     /etc/letsencrypt/live/social.webgecko.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/social.webgecko.com.au/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
